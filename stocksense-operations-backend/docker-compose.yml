services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stocksense_operations
    ports:
      - "5432:5432"
    volumes:
      - stocksense-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stocksense_operations"]
      interval: 5s
      timeout: 5s
      retries: 10

  operations-service:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/stocksense_operations
      JWT_SECRET: replace-with-a-long-random-secret
      INVENTORY_SERVICE_URL: http://host.docker.internal:4000
      INVENTORY_SERVICE_MODE: mock
      INVENTORY_SERVICE_TIMEOUT_MS: 5000
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: development
      AUTH_DEV_BYPASS: "true"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  stocksense-postgres:
